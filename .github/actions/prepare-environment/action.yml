name: Prepare build environment
runs:
  using: composite
  steps:
    - name: Setup Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Configure Cache Environment for sccache
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Copy GitHub specific scripts to git-root folder
      run: cp -va ./.github/scripts/ ./ ; date +%s > ./epoch_job_start.txt
      shell: bash
    - name: Prepare Xcode
      run: ./github_prepare_xcode.sh
      shell: bash
    - name: Cleanup Android Related Stuff
      run: sudo rm -rf $ANDROID_HOME
      shell: bash
    - name: Disable Spotlight
      run: sudo mdutil -a -i off
      shell: bash
    - name: Setup Environment and Toolchain
      run: |
        set -o pipefail
        ./github_setup_env_toolchain.sh | tee -a github_actions_setup_env_toolchain.log
      shell: bash
