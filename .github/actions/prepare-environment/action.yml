name: Prepare build environment
runs:
  using: composite
  steps:
    - name: Setup Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Copy GitHub specific scripts to git-root folder
      run: cp -va ./.github/scripts/ ./ ; date +%s > ./epoch_job_start.txt
      shell: bash
    - name: Prepare Xcode
      run: ./github_prepare_xcode.sh
      shell: bash
    - name: Cleanup Android Related Stuff
      run: |
        sudo rm -rf $ANDROID_HOME
        sudo rm -rf /Users/runner/hostedtoolcache/CodeQL || true
        sudo rm -rf /Users/runner/hostedtoolcache/go || true
        sudo rm -rf /Users/runner/hostedtoolcache/Ruby* || true
        sudo rm -rf /Users/runner/hostedtoolcache/Java* || true
        df -h
      shell: bash
    - name: Disable Spotlight
      run: sudo mdutil -a -i off
      shell: bash
    - name: Setup Environment and Toolchain
      run: |
        set -o pipefail
        ./github_setup_env_toolchain.sh | tee -a github_actions_setup_env_toolchain.log
      shell: bash
