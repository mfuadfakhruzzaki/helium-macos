name: Build macOS binaries of Helium
on:
  workflow_dispatch:
    inputs:
      runner:
        required: false
        description: "Runner image name"
        default: "macos-latest"
      do-release:
        required: false
        type: boolean
        description: "Create a release after build is done"
        default: false
      resume-from-run-id:
        required: false
        type: string
        description: "Previous run ID to resume from (e.g. 40188438323)"
        default: "40188438323"

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build macOS binaries of Helium
    strategy:
      matrix:
        arch: [arm64, x86_64]
      fail-fast: true
      max-parallel: 2
    uses: ./.github/workflows/building.yml
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      os: ${{ inputs.runner }}
      resume-from-run-id: ${{ inputs.resume-from-run-id }}

  release:
    needs: build
    name: Release macOS binaries of Helium
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.do-release }}
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Copy GitHub specific scripts to git-root folder
        run: cp -va ./.github/scripts/ ./
      - name: Disable Spotlight
        run: sudo mdutil -a -i off
      - name: Install coreutils
        run: brew install coreutils
      - name: Prepare release
        id: bake
        run: ./github_prepare_release.sh | tee -a github_actions_release.log
      - name: Check if release assets exist
        id: check_assets
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[].name' > artifacts.txt || true
          cat artifacts.txt
          if grep -q "\.dmg" artifacts.txt; then
            echo "has_dmg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dmg=false" >> "$GITHUB_OUTPUT"
            echo "Build is still in progress across multi-phases. No .dmg produced yet. Skipping release step."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get built x86-64 binary
        if: ${{ steps.check_assets.outputs.has_dmg == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.bake.outputs.x64_file_name }}
      - name: Get built arm64 binary
        if: ${{ steps.check_assets.outputs.has_dmg == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.bake.outputs.arm64_file_name }}
      - name: Generate release note
        if: ${{ steps.check_assets.outputs.has_dmg == 'true' }}
        run: ./github_generate_release_note.sh | tee -a github_actions_release.log
      - name: List deltas
        if: ${{ steps.check_assets.outputs.has_dmg == 'true' }}
        id: list_deltas
        run: |
          {
            echo 'deltas<<EOF'
            find ./release_asset/ -name '*.delta'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Release Helium binaries
        if: ${{ steps.check_assets.outputs.has_dmg == 'true' }}
        uses: imputnet/action-gh-release@v2.5
        with:
          body_path: ./github_release_note.md
          draft: false
          prerelease: true
          files: |
            ./release_asset/${{ steps.bake.outputs.arm64_file_name }}
            ./release_asset/${{ steps.bake.outputs.x64_file_name }}
            ${{ steps.list_deltas.outputs.deltas }}
          name: ${{ steps.bake.outputs.release_name }}
          tag_name: ${{ steps.bake.outputs.release_tag_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
